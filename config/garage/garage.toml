metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

# rpc_secret comes from GARAGE_RPC_SECRET
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Must match Z_CONFIG::$AWS_REGION, since it is part of the request signatures
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
