<VirtualHost *:80>
	ServerName localhost
	DocumentRoot /var/www/zotero/htdocs
	php_value include_path ".:/usr/local/lib/php:/var/www/zotero/include"
	php_value auto_prepend_file "/var/www/zotero/include/header.inc.php"
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	<Directory "/var/www/zotero/htdocs">
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
