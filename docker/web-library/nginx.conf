server {
	listen 80;
	root /usr/share/nginx/html;

	# nginx's default mime.types lacks .mjs and .wasm; browsers refuse modules served as octet-stream
	types {
		text/javascript mjs;
		application/wasm wasm;
	}
	include /etc/nginx/mime.types;

	location /static/ {
		try_files $uri =404;
	}

	location / {
		return 404;
	}
}
